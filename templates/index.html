<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marks Predictor | Linear Regression</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #6C63FF;
    --primary-dark: #4b45c9;
    --accent: #00d2a0;
    --bg-1: #6C63FF;
    --bg-2: #00d2a0;
    --card-bg: rgba(255, 255, 255, 0.95);
    --text-dark: #23233a;
    --text-muted: #6b6b80;
    --error: #ff5470;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    background-size: 200% 200%;
    animation: gradientShift 12s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card {
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    width: 100%;
    max-width: 460px;
    padding: 40px 36px 32px;
    animation: floatUp 0.6s ease;
  }

  @keyframes floatUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .icon-badge {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    box-shadow: 0 10px 24px rgba(108, 99, 255, 0.35);
  }

  h1 {
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    color: var(--text-dark);
    margin: 0 0 6px;
  }

  p.subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    margin: 0 0 28px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dark);
    letter-spacing: 0.02em;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  input[type="number"] {
    width: 100%;
    padding: 14px 52px 14px 16px;
    font-size: 16px;
    font-family: inherit;
    border: 2px solid #e4e4f0;
    border-radius: 12px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    color: var(--text-dark);
  }

  input[type="number"]:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.15);
  }

  .unit {
    position: absolute;
    right: 16px;
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 600;
    pointer-events: none;
  }

  button {
    margin-top: 18px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    box-shadow: 0 10px 24px rgba(108, 99, 255, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 28px rgba(108, 99, 255, 0.45);
  }

  button:active {
    transform: translateY(0);
  }

  .result {
    margin-top: 26px;
    padding: 22px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(108, 99, 255, 0.12), rgba(0, 210, 160, 0.12));
    text-align: center;
    animation: floatUp 0.4s ease;
  }

  .result .label {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .result .value {
    font-size: 42px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 6px 0 4px;
  }

  .result .hint {
    font-size: 13px;
    color: var(--text-muted);
  }

  .progress-bar {
    margin-top: 14px;
    height: 10px;
    background: #e4e4f0;
    border-radius: 20px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    transition: width 0.8s ease;
  }

  .error-box {
    margin-top: 20px;
    padding: 14px 16px;
    border-radius: 12px;
    background: rgba(255, 84, 112, 0.12);
    color: var(--error);
    font-size: 14px;
    font-weight: 500;
    text-align: center;
  }

  footer {
    margin-top: 26px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
  }
</style>
</head>
<body>

  <div class="card">
    <div class="icon-badge">📊</div>
    <h1>Marks Predictor</h1>
    <p class="subtitle">Simple Linear Regression &middot; predicts marks from study hours</p>

    <form method="POST" action="/">
      <label for="hours">Hours studied</label>
      <div class="input-wrap">
        <input
          type="number"
          id="hours"
          name="hours"
          step="0.1"
          min="0"
          max="24"
          placeholder="e.g. 5.5"
          value="{{ hours if hours is not none else '' }}"
          required
        />
        <span class="unit">hrs</span>
      </div>
      <button type="submit">Predict my marks</button>
    </form>

    {% if error %}
      <div class="error-box">⚠️ {{ error }}</div>
    {% endif %}

    {% if prediction is not none %}
      <div class="result">
        <div class="label">Predicted Marks</div>
        <div class="value">{{ prediction }}</div>
        <div class="hint">based on {{ hours }} hour(s) of study</div>
        <div class="progress-bar">
          <div class="progress-fill" style="width: {{ prediction }}%;"></div>
        </div>
      </div>
    {% endif %}

    <footer>Built with Flask &amp; scikit-learn</footer>
  </div>

</body>
</html>
